# Default config, copied into the plugin's data folder on first run.
# Edit the copy in plugins/custom-prefix-plugin/config.properties on your
# proxy — editing this file inside the jar does nothing after first launch.

# Base URL of your self-hosted website/backend (no trailing slash).
backend.baseUrl=http://127.0.0.1:8080

# Must match BACKEND_API_KEY in the website's .env exactly.
backend.apiKey=CHANGE_ME_TO_A_LONG_RANDOM_VALUE

# Permission node required to run /prefix. Grant with LuckPerms, e.g.:
#   /lp group default permission set customprefix.use true
permission.node=customprefix.use

# Permission node that lets a player's saved prefix skip the moderation
# word filter entirely (both the built-in staff-impersonation words and
# your own moderation.words.txt list) — for staff who legitimately want
# an "Owner"/"Admin"-flavored custom prefix. Nobody has this by default;
# grant it deliberately to trusted staff only, e.g.:
#   /lp group admin permission set customprefix.bypassfilter true
permission.bypassFilter=customprefix.bypassfilter

# Permission node for '/prefix admin', which sends a short-lived (10 min),
# single-use link that logs straight into the admin audit log page
# (/admin.html) without needing the ADMIN_USERNAME/ADMIN_PASSWORD from the
# website's .env — those still work too, this is just a faster path for
# whoever holds this permission. Nobody has it by default; grant it
# deliberately, e.g.:
#   /lp group admin permission set customprefix.admin true
permission.adminAccess=customprefix.admin

# LuckPerms prefix priority/weight this plugin manages. Only prefix nodes
# at exactly this priority are ever touched/replaced — prefixes your rank
# ladder sets at other priorities are left alone.
prefix.priority=100

# How long a generated link stays valid, in minutes. Should match
# SESSION_TTL_MINUTES on the website.
link.ttlMinutes=20

# How often (seconds) the plugin polls the backend for a finished session.
# Lower = faster "applied" after clicking Save, at the cost of slightly
# more requests to your own backend — 1s is fine for any normal-sized
# server.
poll.intervalSeconds=1

# HTTP timeout (seconds) for calls to the backend.
http.timeoutSeconds=5

# Message templates. '&' color codes are translated for you. '{url}' is
# replaced with the personal link in message.linkSent.
message.linkSent=&aClick to design your custom prefix (expires in {ttl} min): {url}
message.applied=&aYour new prefix has been applied!
message.expired=&cYour prefix link expired. Run /prefix again.
message.alreadyPending=&eYour previous link was cancelled — here's a new one.
message.noPermission=&cYou don't have permission to use this command.
message.backendUnreachable=&cCouldn't reach the prefix server. Try again shortly.
message.playersOnly=&cOnly players can use this command.
message.removed=&aYour custom prefix has been removed.
message.removeFailed=&cCouldn't remove your prefix — try again shortly.
message.usage=&cUsage: /prefix create &7or&c /prefix remove
message.adminLinkSent=&aAdmin panel link (expires in {ttl} min, works once):
message.adminNoPermission=&cYou don't have permission to access the admin panel.
